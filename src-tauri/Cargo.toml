[package]
name = "pinhole"
version = "0.1.0"
description = "Peer-to-peer port sharing over iroh"
edition = "2024"
license = "MIT"
# let-chains (src/tunnel.rs)
rust-version = "1.88"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "pinhole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
iroh = "1.4.1"
n0-future = "0.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# No `panic = "abort"`: a panic in one tunnel task must not take the whole app down
# (see `lock` in src/tunnel.rs, which keeps state usable after one).
strip = true
